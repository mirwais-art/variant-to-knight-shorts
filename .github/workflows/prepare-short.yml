name: Prepare Knight Short

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Prepare a Short even if 72 hours have not passed"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: prepare-knight-short
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install video downloader
        run: python -m pip install --upgrade yt-dlp

      - name: Prepare highlight
        id: prepare
        env:
          SOURCE_URL: https://www.youtube.com/@VariantFPS/videos
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          if [ "$FORCE_RUN" = "true" ]; then
            python worker/make_short.py --force
          else
            python worker/make_short.py
          fi

      - name: Publish latest prepared clip
        if: steps.prepare.outputs.generated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest clip.mp4 metadata.json --clobber
            gh release edit latest --title "Latest Knight Short" --notes "Automatically prepared from an owned VariantFPS video."
          else
            gh release create latest clip.mp4 metadata.json --title "Latest Knight Short" --notes "Automatically prepared from an owned VariantFPS video." --latest
          fi

      - name: Save rotation state
        if: steps.prepare.outputs.generated == 'true'
        run: |
          git config user.name "variant-shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update Shorts rotation state"
          git push
